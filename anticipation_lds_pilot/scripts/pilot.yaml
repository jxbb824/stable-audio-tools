# Subset-model LDS pilot on the seller-selected training pool (~3633 tracks).
# Mirrors ../anticipation (30 random 50% subset checkpoints + LoGra/TRAK LDS),
# but uses anticipation_ip_pilot data/queries and keeps outputs isolated here.

seed: 42
num_subsets: 30
subset_ratio: 0.5
num_queries: 500

train_file: anticipation_ip_pilot/data/finetune/train_v2.txt
valid_file: anticipation_ip_pilot/data/finetune/test_v2.txt
queries_file: anticipation_ip_pilot/outputs/queries/generated_samples_prompted_500.txt
pool_indices_file: anticipation_ip_pilot/outputs/selection/seller_indices.txt

pretrained_model_path: stanford-crfm/music-small-800k
outputs_dir: anticipation_lds_pilot/outputs
subsets_dir: anticipation_lds_pilot/outputs/models/subsets
full_logra_dir: anticipation_lds_pilot/outputs/models/full_logra
full_trak_dir: anticipation_lds_pilot/outputs/models/full_trak
attribution_dir: anticipation_lds_pilot/outputs/attribution
lds_dir: anticipation_lds_pilot/outputs/lds

training:
  epochs: 5
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5

attribution:
  batch_size_logra: 8
  batch_size_trak: 2
  logra_project_dim: 4096
  logra_damping: 0.01
  trak_num_checkpoints: 5
  trak_project_dim: 8192
  trak_regularization: 0.01
  trak_proj_type: random_mask
  trak_proj_max_batch_size: 40

slurm:
  partition: GPU-shared
  account: mth240006p
  conda_env: sat-jamendo
